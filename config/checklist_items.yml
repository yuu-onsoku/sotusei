# 覚悟のチェックリスト
# 猫を飼うときの「大変な現実」の一覧
# text:     大変なこと（見出し）
# category: どの分類か（画面ではこの分類ごとにまとめて表示する）
# detail:   どれくらい大変かの説明

items:
  - text: "毎日、たくさん毛が抜けます"
    category: "毎日のお世話"
    detail: "特に春と秋は毛が生え変わる時期で、服やソファが毛だらけになります。毎日の掃除が必要です。"
  - text: "よく吐きます"
    category: "毎日のお世話"
    detail: "毛玉や早食いが原因で、猫はわりと頻繁に吐きます。カーペットや布団の上に吐かれることも覚悟しておきましょう。ただし頻度が多い場合は病気の可能性もあります。"
  - text: "毎日のトイレ掃除が欠かせません"
    category: "毎日のお世話"
    detail: "猫はきれい好きで、トイレが汚れていると別の場所で粗相をすることがあります。1日1〜2回の掃除と、定期的な砂の交換が必要です。"

  - text: "夜中や早朝に鳴いて起こされることがあります"
    category: "ねこの行動"
    detail: "猫は明け方に元気になる動物です。ごはんの催促で毎朝5時に起こされることもあります。"
  - text: "個体差もありますが、引っかかれるかもしれません"
    category: "ねこの行動"
    detail: "遊びに夢中になったときや、嫌なことをされたときに引っかいたり噛んだりすることがあります。腕に傷ができたり、服がほつれたりすることもあります。"
  - text: "脱走に注意が必要です"
    category: "ねこの行動"
    detail: "玄関の開け閉めや網戸のすき間から外に出てしまうことがあります。脱走防止の柵を付けたり、窓の開け方に気をつけたりしましょう。"

  - text: "家具や壁で爪とぎをします"
    category: "家や物への影響"
    detail: "爪とぎは猫の本能なのでやめさせることはできません。爪とぎ器を用意しても、ソファや壁紙がボロボロになることがあります。"
  - text: "高いところに登り、物を落とします"
    category: "家や物への影響"
    detail: "棚やキッチンの上にも平気で登ります。コップや置物を落として割ることがあるので、壊れやすい物は片付けておきましょう。"
  - text: "コードや小さな物をかじったり飲み込んだりします"
    category: "家や物への影響"
    detail: "電気コードをかじって感電したり、輪ゴムやひもを飲み込んで腸閉塞になったりすることがあります。床に物を置きっぱなしにしないことが大切です。"
  - text: "退去時に修繕費がかかることがあります"
    category: "家や物への影響"
    detail: "ペット可の賃貸でも、爪とぎやおしっこで傷んだ壁や床の修繕費を、退去時に請求されることがあります。"

  - text: "医療費が思った以上にかかります"
    category: "健康とお金"
    detail: "ペットには公的な健康保険がないため、診察や手術は全額自己負担です。手術や入院で数十万円かかることもあるため、ペット保険や貯金を検討しましょう。"
  - text: "人間の食べ物や身近な植物で中毒を起こすことがあります"
    category: "健康とお金"
    detail: "玉ねぎ・ネギ類、チョコレート、ぶどうなどは猫にとって危険です。また、ユリ科の植物は花粉や花瓶の水でも命に関わるため、家に置かないようにしましょう。"
  - text: "避妊・去勢手術を考える必要があります"
    category: "健康とお金"
    detail: "手術をしないと、発情期に大きな声で鳴き続けたり、オスはおしっこをまき散らすマーキング（スプレー）をしたりすることがあります。"

  - text: "猫アレルギーだと、一緒に暮らせないことがあります"
    category: "暮らしと将来"
    detail: "飼い始めてから家族のアレルギーが分かると、手放さざるを得なくなることもあります。事前に保護猫カフェなどで猫と触れ合って確かめておくと安心です。"
  - text: "長期間家を空けにくくなります"
    category: "暮らしと将来"
    detail: "旅行や出張のときは、ペットシッターやペットホテルの手配が必要です。猫は環境の変化に弱いので、預け先選びにも気を使います。"
  - text: "15年以上一緒に暮らす覚悟が必要です"
    category: "暮らしと将来"
    detail: "室内飼いの猫の寿命は15〜20年ほどです。引っ越し、結婚、転勤など、将来のライフイベントも含めて考える必要があります。"
