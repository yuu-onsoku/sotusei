# お迎え診断の質問と配点
#
# simple:     ログイン不要の簡易診断（5問）
# additional: ログイン後の詳細診断で、simple に足して出す質問（8問）
#
# 詳細診断は「simple + additional」の13問。
# additional を別に持つことで、簡易診断の5問を2か所に書かずに済む。
#
# 判定の境目は満点に対する割合で決めている（DiagnosisJudge#result）ので、
# ここに質問を足しても判定の調整は要らない。

simple:
  - text: "平日、家を空けている時間はどれくらいですか？"
    category: "生活リズム"
    choices:
      - { text: "6時間未満", score: 2 }
      - { text: "6〜10時間未満", score: 0 }
      - { text: "10時間以上", score: -2 }

  - text: "家に人がいない状態で年に何回くらい、家を2〜3日空けますか？"
    category: "生活リズム"
    choices:
      - { text: "空けない", score: 2 }
      - { text: "年に1〜2回", score: 0 }
      - { text: "年に3回以上", blocker: true }

  # 引っ越し予定は「行動を起こしている」ため、0ではなく1点を与える
  - text: "今のお住まいはペットを飼えますか？"
    category: "住環境"
    choices:
      - { text: "現在ペット可の住宅に住んでいる", score: 2 }
      - { text: "ペット可の住宅に引っ越し予定（引っ越し検討）", score: 1 }
      - { text: "現在はペット不可の住宅に住んでいる", blocker: true }

  - text: "急に10万円の医療費が必要になったら、出せますか？"
    category: "経済"
    choices:
      - { text: "無理なく払える", score: 2 }
      - { text: "頑張れば払える", score: 0 }
      - { text: "払えない", blocker: true }
      
  - text: "猫のために月々使える金額はどれくらいですか？"
    category: "経済"
    choices:
      - { text: "1万円以上", score: 2 }
      - { text: "7000円〜1万円未満", score: 0 }
      - { text: "7000円未満", score: -2 }

# ----------------------------------------------------------------
# 詳細診断で追加する8問。
# 利用者アンケートとLINEで寄せられた声をもとにしている。
# ----------------------------------------------------------------
additional:
  # 実際に「子どもに動物アレルギーが見つかった」経験から寄せられた質問。
  # 飼えなくなる事情はいつ生まれるか分からない、という指摘を絶対条件にした
  - text: "結婚や出産でご家族が増え、その方が猫アレルギーだったとき、飼い続けられますか？"
    category: "将来"
    choices:
      - { text: "飼い続けられる", score: 2 }
      - { text: "責任を持って引き取ってくれるあてがある", score: 1 }
      - { text: "責任は持てない", blocker: true }

  - text: "急な入院などで家に帰れないとき、猫の世話を頼める方はいますか？"
    category: "将来"
    choices:
      - { text: "いる（合鍵を渡せる方など）", score: 2 }
      - { text: "ペットホテルや預け先のあてがある", score: 1 }
      - { text: "いない", score: -2 }

  # 散らかっていると誤飲の原因になる、という声から
  - text: "誤飲を防ぐため、床に物を置かない習慣をつけられますか？"
    category: "安全"
    choices:
      - { text: "習慣にできる", score: 2 }
      - { text: "意識すればできる", score: 0 }
      - { text: "難しい", score: -2 }

  - text: "留守中に停電などでエアコンが止まったとき、気づいて対処できますか？"
    category: "安全"
    choices:
      - { text: "できる（外出先から確認・操作できる）", score: 2 }
      - { text: "すぐには無理だが、暑さ対策は考えている", score: 0 }
      - { text: "考えていない", score: -2 }

  - text: "コンセントや配線に、かじられない対策をできますか？"
    category: "安全"
    choices:
      - { text: "できる", score: 2 }
      - { text: "一部はできる", score: 0 }
      - { text: "難しい", score: -2 }

  - text: "キッチンに入れないようにするなど、火元まわりの安全を確保できますか？"
    category: "安全"
    choices:
      - { text: "できる", score: 2 }
      - { text: "見ているときだけ気をつける", score: 0 }
      - { text: "難しい", score: -2 }

  # 先住の動物がいること自体は減点しない。相性を考えているかを見る
  - text: "いま、ほかに動物を飼っていますか？"
    category: "住環境"
    choices:
      - { text: "飼っていない", score: 2 }
      - { text: "飼っている。相性や慣らし方を調べている", score: 2 }
      - { text: "飼っている。これから考える", score: 0 }
      - { text: "飼っているが、特に考えていない", score: -2 }

  # 家族が反対している状態で迎えると、いちばん困るのは猫なので絶対条件にした
  - text: "一緒に住むご家族全員の同意は取れていますか？"
    category: "住環境"
    choices:
      - { text: "一人暮らしなので、同意は必要ない", score: 2 }
      - { text: "全員の同意がある", score: 2 }
      - { text: "これから話す", score: 0 }
      - { text: "反対している方がいる", blocker: true }

  # 爪のケアは、できないと猫が痛い思いをする（巻き爪が肉球に食い込む、
  # 布や家具に引っかかって怪我をする）ため絶対条件にした。
  # 野良猫はコンクリートなどで自然に削れるが、家の中ではそれが起きない
  - text: "猫の爪切りはできますか？ 自分で切るのが難しい場合、動物病院などで定期的にケアできますか？"
    category: "お世話"
    choices:
      - { text: "自分で切れる", score: 2 }
      - { text: "動物病院などで切ってもらう", score: 1 }
      - { text: "どちらも難しい", blocker: true }

  # 猫はベッドや冷蔵庫の上など、思わぬ場所で吐くことがある。
  # おおらかに片付けられないと、人も猫もつらくなる、という声から
  - text: "猫は、ベッドや冷蔵庫の上など思わぬ場所で吐くことがあります。おおらかな気持ちで片付けられますか？"
    category: "お世話"
    choices:
      - { text: "できる", score: 2 }
      - { text: "最初はとまどうかもしれないが、慣れると思う", score: 0 }
      - { text: "怒ってしまうかもしれない", score: -2 }

  # アレルギーを確かめずに迎えると、人も猫もつらい結果になる。
  # 猫カフェや知人の家などで触れて、症状が出ないか確認してほしい
  - text: "猫と触れ合った経験があり、アレルギーが出ないことを確認していますか？"
    category: "健康"
    choices:
      - { text: "確認済み", score: 2 }
      - { text: "確認していない", blocker: true }

  # 「たぶん大丈夫」は猫に対して不誠実なので、選択肢に置かない
  - text: "猫の寿命は15〜20年です。その間、飼い続けられる見通しはありますか？"
    category: "将来"
    choices:
      - { text: "ある", score: 2 }
      - { text: "わからない", score: -2 }

  # 脱走は交通事故や行方不明につながり、猫がいちばん悲しい思いをするため絶対条件にした
  - text: "窓や玄関からの脱走を防ぐ対策（脱走防止柵、網戸のロックなど）ができますか？"
    category: "安全"
    choices:
      - { text: "できる", score: 2 }
      - { text: "一部はできる", score: 0 }
      - { text: "難しい", blocker: true }

  # 「対策すれば大丈夫」は前向きに動いている人なので、0ではなく1点
  - text: "猫の抜け毛や、家具・壁での爪とぎを受け入れられますか？"
    category: "お世話"
    choices:
      - { text: "受け入れられる", score: 2 }
      - { text: "対策すれば大丈夫", score: 1 }
      - { text: "受け入れられない", score: -2 }

  - text: "トイレ掃除やごはんなど、毎日のお世話の時間を確保できますか？"
    category: "お世話"
    choices:
      - { text: "できる", score: 2 }
      - { text: "忙しい日は難しいかも", score: 0 }
      - { text: "難しい", score: -2 }
